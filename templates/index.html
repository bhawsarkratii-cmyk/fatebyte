<!DOCTYPE html>
<html>
<head>
    <title>Fortune Generator 🔮</title>
</head>

<body>
    <marquee style="background-color: #2c3e50; color: #ffffff; font-family: Arial, sans-serif; font-size: 20px; padding: 15px; border-radius: 8px; font-weight: bold;"> 
    check your faith bestiee 😉

    </marquee>

    <h1>🔮 Fortune Generator</h1>

    <p>tap in bestie to see if you are cooked or cooking!</p>

    <button onclick="getFortune()">Get My Fortune</button>

    <h2 id="fortune"></h2>

    <script>
        function getFortune() {
            fetch("/fortune")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("fortune").innerText = data.fortune;
                });
        }
    </script>

</body>
</html>
